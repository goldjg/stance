name: ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  GO_VERSION: '1.26.10'
  GOTOOLCHAIN: local

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify Go compiler
        run: |
          go version
          if [ "$(go env GOVERSION)" != "go${GO_VERSION}" ]; then
            echo "::error::Expected Go ${GO_VERSION}; refusing an unexpected compiler."
            exit 1
          fi

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...
